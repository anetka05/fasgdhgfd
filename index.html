<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title><3</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:#000}
html,body{height:100%;margin:0}
body{background:#000;color:#eee;font-family:Georgia,"Times New Roman",serif;overflow-x:hidden}
.scene{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .5s ease-in}
#s1.out{opacity:0}
#s2{display:none;text-align:center;padding:0 14px;box-sizing:border-box}
#s2 svg{flex:1;min-height:0;width:100%;overflow:visible}
.hi{font-size:20px;margin:0 0 22px;letter-spacing:.5px;white-space:pre-wrap;min-height:1.3em}
#s2 .hi{margin:0 0 10px}

.box{position:relative;width:170px;height:150px;margin-bottom:28px}
.base{position:absolute;bottom:0;left:0;width:170px;height:105px;background:#caa57a;border-radius:3px}
.lid{position:absolute;left:-8px;bottom:105px;width:186px;height:38px;background:#9b6e42;border-radius:3px;transform-origin:left bottom}
.base:after,.lid:after{content:"";position:absolute;top:0;bottom:0;left:50%;width:20px;margin-left:-10px;background:#c2342a}
.box.open{animation:shake 1s forwards}
.box.open .lid{animation:lid 1.15s forwards}




@keyframes shake{0%{transform:none}10%{transform:rotate(-1.5deg)}18%{transform:rotate(1.2deg)}26%{transform:rotate(-.8deg)}34%,100%{transform:none}}
@keyframes lid{
 0%{transform:none}
 12%{transform:translateY(-5px) rotate(-1deg);animation-timing-function:ease-in}
 24%{transform:translateY(0) rotate(0)}
 38%{transform:translateY(-8px) rotate(-2.5deg);animation-timing-function:ease-in}
 52%{transform:translateY(-2px) rotate(-.5deg)}
 74%{transform:translateY(-36px) rotate(-13deg);animation-timing-function:ease-out}
 88%{transform:translateY(-27px) rotate(-7deg)}
 100%{transform:translateY(-30px) rotate(-9deg)}}
button{font:inherit;font-size:17px;color:#eee;background:transparent;border:1.5px solid #eee;border-radius:999px;padding:9px 34px;cursor:pointer}
button:hover{background:#eee;color:#000}

.gr{transform-box:fill-box;transform-origin:50% 100%;transform:scaleY(0)}
.go .gr{animation:gup var(--t) var(--d) forwards ease-out}
.st{fill:none;stroke:#6f9a5a;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.go .st{animation:draw var(--t) var(--d) forwards linear}
.bl{transform:scale(0)}
.go .bl{animation:pop var(--bt) var(--d) forwards ease-out}




@keyframes draw{0%{stroke-dashoffset:1;animation-timing-function:ease-out}
 38%{stroke-dashoffset:.55}
 46%{stroke-dashoffset:.53;animation-timing-function:ease-in-out}
 100%{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(0) rotate(-25deg)}
 55%{transform:scale(1.14) rotate(4deg)}
 78%{transform:scale(.95) rotate(-1deg)}
 100%{transform:scale(1) rotate(0)}}
@keyframes gup{0%{transform:scaleY(0)}65%{transform:scaleY(1.1)}100%{transform:scaleY(1)}}
@keyframes sway{from{rotate:var(--a1)}to{rotate:var(--a2)}}
@keyframes gsway{from{rotate:-2deg}to{rotate:2.5deg}}
@media (prefers-reduced-motion:reduce){.go *{animation-duration:.01s!important}}
</style>
</head>
<body>

<div id="s1" class="scene">
  <p class="hi">pro tebe, zeno moje<3</p>
  <div class="box" id="box"><div class="base"></div><div class="lid"></div></div>
  <button id="next">otevri :)</button>
</div>

<div id="s2" class="scene">
  <p class="hi">dlouho jsem ti nedala kyticku, tak ti davam aspon jednu virtualni</p>
  <p class="hi">mam te rada<3</p>
  <svg id="art" viewBox="0 0 600 560" preserveAspectRatio="xMidYMax meet" role="img"></svg>
</div>

<script>
const R=(a,b)=>a+Math.random()*(b-a);
const f1=n=>n.toFixed(1);




const peony=c=>{let s='';
  [[10,27,22,17],[9,21,19,15],[8,15,15,12],[6,9,11,9],[5,3,8,7]].forEach(([n,d,ry,rx],k)=>{
    const off=R(0,40);
    for(let i=0;i<n;i++){
      s+=`<ellipse cy="${f1(-d*R(.92,1.08))}" rx="${f1(rx*R(.88,1.1))}" ry="${f1(ry*R(.9,1.1))}" fill="${c[k]}" fill-opacity="${f1(R(.9,1))}" stroke="rgba(110,40,70,.22)" stroke-width=".8" transform="rotate(${f1(i*360/n+off+R(-8,8))})"/>`}});
  return s};
const lily=([f,m])=>{let s='';
  [30,0].forEach(o=>{for(let i=0;i<3;i++){
    const w=R(.9,1.12),l=R(.92,1.08);
    s+=`<g transform="rotate(${f1(o+i*120+R(-7,7))}) scale(${f1(w)} ${f1(l)})"><path d="M0,0C-15,-14 -15,-42 0,-66C15,-42 15,-14 0,0Z" fill="${f}" stroke="rgba(120,60,30,.25)" stroke-width=".8"/><path d="M0,-4V-52" stroke="${m}" stroke-width="2.5" stroke-linecap="round" opacity=".7"/></g>`}});
  for(let i=0;i<6;i++){const a=(i*60+R(0,25))*Math.PI/180,q=R(22,30),x=Math.sin(a)*q,y=-Math.cos(a)*q;
    s+=`<path d="M0,0L${f1(x)},${f1(y)}" stroke="#b58a4a" stroke-width="1.3"/><circle cx="${f1(x)}" cy="${f1(y)}" r="2.6" fill="#8a4b2a"/>`}
  return s+`<circle r="3" fill="#b7c46a"/>`};
const daisy=()=>{let s='';
  for(let i=0;i<14;i++)s+=`<ellipse cy="${f1(-R(15,19))}" rx="${f1(R(3.8,5))}" ry="${f1(R(12,15))}" fill="#fff" stroke="rgba(0,0,0,.15)" stroke-width=".6" transform="rotate(${f1(i*360/14+R(-6,6))})"/>`;
  return s+`<circle r="7" fill="#f2c340"/>`};
const small=(c,r=3)=>{let s='';for(let i=0;i<5;i++){const a=(i*72+R(-8,8))*Math.PI/180;s+=`<circle cx="${f1(Math.sin(a)*r*1.1)}" cy="${f1(-Math.cos(a)*r*1.1)}" r="${f1(r*R(.9,1.1))}" fill="${c}"/>`}return s+`<circle r="${r*.6}" fill="#f2c340"/>`};
const filler=()=>[[-9,0],[8,-6],[0,9]].map(([x,y])=>`<g transform="translate(${f1(x+R(-2,2))} ${f1(y+R(-2,2))})">${small('#8fb0e8',3.2)}</g>`).join('');

const pink=['#f7c9d4','#f2b0c2','#ec97b0','#e17f9c','#d56a8a'];
const coral=['#ffd9c9','#ffc4ad','#fbab94','#f39580','#e8806c'];
const blush=['#fff1f3','#fbdfe5','#f6cbd6','#eeb5c4','#e49fb2'];





const head=(x,y,r,s,inner,d)=>{
  const a=R(1,3.5)*(Math.random()<.5?-1:1);
  return `<g transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(r)}) scale(${f1(s)})"><g class="bl" style="--d:${f1(d)}s;--bt:${f1(R(.55,.9))}s;--sd:${f1(d+1)}s;--p:${f1(R(2.4,5))}s;--a1:${f1(a)}deg;--a2:${f1(-a*R(.4,1.2))}deg">${inner}</g></g>`};
const stem=(x0,y0,x,y,d,w,t)=>{
  const dy=y-y0;
  return `<path class="st" pathLength="1" stroke-width="${w}" d="M${f1(x0)},${f1(y0)} C${f1(x0+(x-x0)*.1+R(-14,14))},${f1(y0+dy*.35)} ${f1(x+R(-14,14))},${f1(y0+dy*.75)} ${f1(x)},${f1(y)}" style="--d:${f1(d)}s;--t:${f1(t)}s"/>`};

let svg='';




const cols=['#f2a6b8','#ffffff','#f6d36b','#b9a4e0','#f4a27a'];
let side='',heads='';
for(let i=0;i<16;i++){
  const x=i%2?R(380,590):R(10,220),h=R(80,190),lean=R(-18,18),d=R(.2,1.6),t=R(.6,1.1);
  side+=stem(x,500,x+lean,500-h,d,2,t);
  heads+=head(x+lean,500-h,R(0,70),R(.9,1.5),small(cols[i%5],R(4,5.5)),d+t*.85);
}
svg+=side+heads;




for(let i=0;i<110;i++){
  const x=-60+i*6.1+R(-3,3),y=R(490,505),h=R(22,60),l=R(-12,12),g=['#7fa86a','#8db878','#6b9558'][i%3];
  const d=R(0,1.4);
  svg+=`<path class="gr" style="--d:${f1(d)}s;--t:${f1(R(.45,.9))}s;--sd:${f1(d+1.2)}s;--p:${f1(R(2,4.5))}s" fill="${g}" d="M${f1(x-3)},${f1(y)}Q${f1(x)},${f1(y-h*.6)} ${f1(x+l)},${f1(y-h)}Q${f1(x+1)},${f1(y-h*.5)} ${f1(x+3)},${f1(y)}Z"/>`;
}




const items=[
 ['f',165,250],['f',435,245],['f',205,185],['f',400,195],['f',300,118],
 ['l',250,165,-18,1,['#f9b36b','#e9783a']],['l',355,180,22,.95,['#fff4f0','#f0a5b5']],
 ['p',300,235,0,1.05,pink],['p',222,268,-8,.9,coral],['p',380,272,8,.9,blush],
 ['d',178,330,-10,.75],['d',420,335,10,.75],['d',300,328,0,.7]
];
let leaves='',stems='',flowers='';
[-75,-52,52,75].forEach(a=>{
  const d=R(.6,1.3);
  leaves+=`<g transform="translate(300 408) rotate(${f1(a+R(-6,6))}) scale(${f1(R(1.15,1.4))})"><path class="bl" style="--d:${f1(d)}s;--bt:.7s;--sd:${f1(d+1)}s;--p:${f1(R(3,5))}s;--a1:-2deg;--a2:2deg" d="M0,0C10,-10 10,-35 0,-55C-10,-35 -10,-10 0,0Z" fill="#7fa86a" stroke="rgba(0,0,0,.12)"/></g>`});
items.forEach(it=>{
  const [t,x0,y0,r0=0,s=1,c]=it;
  const x=x0+R(-9,9),y=y0+R(-8,8),r=r0+R(-6,6);
  const sd=R(.7,1.9),st=R(.7,1.1);
  stems+=stem(300,402,x,y,sd,3,st);
  const inner=t=='p'?peony(c):t=='l'?lily(c):t=='d'?daisy():filler();
  flowers+=head(x,y,r,t=='f'?1.1:s*R(.93,1.07),inner,sd+st*.85+R(0,.25));
});
svg+=leaves+stems+flowers;



document.getElementById('art').innerHTML=svg;

const s1=document.getElementById('s1'),s2=document.getElementById('s2');
document.getElementById('next').onclick=function(){
  this.disabled=true;
  document.getElementById('box').classList.add('open');
  setTimeout(()=>s1.classList.add('out'),1250);
  setTimeout(()=>{
    s1.style.display='none';s2.style.display='flex';void s2.offsetWidth;s2.classList.add('go');
  },1750);
};
</script>
</body>
</html>
